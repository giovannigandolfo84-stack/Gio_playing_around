[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-fund"
version = "0.1.0"
description = "Disciplined multi-agent crypto research and paper-trading system ($100 experiment)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
live = ["ccxt>=4.0"]
dev = ["pytest>=8"]

[project.scripts]
crypto-fund = "crypto_fund.cli:main"

[tool.setuptools.packages.find]
include = ["crypto_fund*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
