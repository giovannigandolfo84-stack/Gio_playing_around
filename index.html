<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Ledger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    /* dark palette (case-back) — default */
    --bg:#15171b;
    --surface:#1d2024;
    --surface-alt:#22262b;
    --border:#2e333a;
    --text:#ede9e0;
    --text-secondary:#a6a196;
    --text-muted:#6d685f;
    --accent:#c6963f;
    --accent-ink:#15171b;
    --success-bg:#1e2a20;
    --success-text:#82c288;
    --danger:#e0796a;
    --danger-bg:#2c1e1c;
    --radius:10px;
    --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    --sans:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f1efe9;
      --surface:#ffffff;
      --surface-alt:#faf8f3;
      --border:#e1ddd1;
      --text:#201e1a;
      --text-secondary:#66625a;
      --text-muted:#9c978c;
      --accent:#8a6425;
      --accent-ink:#ffffff;
      --success-bg:#e7f0e5;
      --success-text:#3c6b3e;
      --danger:#a13e33;
      --danger-bg:#f6e9e6;
    }
  }
  :root[data-theme="light"]{
    --bg:#f1efe9;
    --surface:#ffffff;
    --surface-alt:#faf8f3;
    --border:#e1ddd1;
    --text:#201e1a;
    --text-secondary:#66625a;
    --text-muted:#9c978c;
    --accent:#8a6425;
    --accent-ink:#ffffff;
    --success-bg:#e7f0e5;
    --success-text:#3c6b3e;
    --danger:#a13e33;
    --danger-bg:#f6e9e6;
  }
  :root[data-theme="dark"]{
    --bg:#15171b;
    --surface:#1d2024;
    --surface-alt:#22262b;
    --border:#2e333a;
    --text:#ede9e0;
    --text-secondary:#a6a196;
    --text-muted:#6d685f;
    --accent:#c6963f;
    --accent-ink:#15171b;
    --success-bg:#1e2a20;
    --success-text:#82c288;
    --danger:#e0796a;
    --danger-bg:#2c1e1c;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--sans);
    background:var(--bg);
    color:var(--text);
    padding:32px 18px 60px;
  }
  .wrap{max-width:620px;margin:0 auto;}

  .masthead{margin-bottom:22px;}
  .eyebrow{
    font-family:var(--sans);
    font-size:11px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--text-muted);
    margin:0 0 6px;
  }
  h1{
    font-family:var(--serif);
    font-size:34px;
    font-weight:600;
    letter-spacing:.01em;
    margin:0 0 12px;
    text-wrap:balance;
  }
  .rule{
    height:1px;
    background:linear-gradient(to right,var(--accent),var(--border) 60%);
    border:none;
    margin:0;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px;
    margin-top:18px;
  }
  h3{
    font-family:var(--serif);
    font-size:19px;
    font-weight:600;
    margin:0 0 12px;
    color:var(--text);
  }

  .form-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  input{
    flex:1;
    min-width:110px;
    padding:10px 11px;
    border:1px solid var(--border);
    border-radius:8px;
    font-family:var(--sans);
    font-size:14px;
    background:var(--surface-alt);
    color:var(--text);
  }
  input::placeholder{color:var(--text-muted);}
  input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  input[type="number"]{font-family:var(--mono);font-variant-numeric:tabular-nums;}

  button{
    padding:10px 16px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--surface-alt);
    font-family:var(--sans);
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    color:var(--text);
  }
  button:hover{border-color:var(--accent);}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  button.primary:hover{opacity:.92;}

  .err{color:var(--danger);font-size:13px;margin:6px 0 0;display:none;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{
    text-align:left;
    padding:6px 8px;
    font-family:var(--sans);
    font-size:11px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-muted);
    border-bottom:1px solid var(--border);
  }
  td{padding:9px 8px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;}

  .actions{text-align:right;white-space:nowrap;}
  .link-btn{
    border:none;background:none;padding:3px 7px;font-family:var(--sans);font-size:12px;font-weight:600;cursor:pointer;border-radius:6px;
  }
  .link-btn:hover{background:var(--surface-alt);}
  .sold-link{color:var(--success-text);}
  .del-link{color:var(--text-muted);font-size:15px;font-weight:400;}
  .empty{font-family:var(--sans);font-size:13px;color:var(--text-muted);padding:6px 0 2px;}

  .metric-lead{
    background:var(--surface);
    border:1px solid var(--border);
    border-top:2px solid var(--accent);
    border-radius:var(--radius);
    padding:18px 20px;
    margin-top:26px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .metric-lead .label{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--text);}
  .metric-lead .value{font-family:var(--mono);font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--text);}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;
    margin-top:12px;
  }
  .metric{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px;
  }
  .metric.cash{background:var(--success-bg);border-color:var(--success-bg);}
  .metric p.label{
    font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    color:var(--text-secondary);margin:0;
  }
  .metric.cash p.label{color:var(--success-text);}
  .metric p.value{font-family:var(--mono);font-size:20px;font-weight:500;margin:6px 0 0;font-variant-numeric:tabular-nums;color:var(--text);}
  .metric.cash p.value{color:var(--success-text);}

  .modal-overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(10,9,7,0.55);
    align-items:center;justify-content:center;
    z-index:100;
    padding:16px;
  }
  .modal{
    background:var(--surface);border-radius:12px;padding:22px;
    width:100%;max-width:320px;
    border:1px solid var(--border);
  }
  .modal p.title{font-family:var(--serif);font-size:20px;font-weight:600;margin:0 0 2px;color:var(--text);}
  .modal p.sub{font-family:var(--sans);font-size:13px;color:var(--text-secondary);margin:0 0 12px;}
  .modal input{width:100%;}
  .modal .buttons{display:flex;gap:8px;margin-top:12px;}
  .modal .buttons button{flex:1;}
  .check-row{display:flex;align-items:center;gap:7px;font-family:var(--sans);font-size:13px;cursor:pointer;color:var(--text);}
  .check-row input{flex:none;width:auto;padding:0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <p class="eyebrow">Private collection</p>
    <h1>Watch Ledger</h1>
    <hr class="rule">
  </div>

  <div class="card">
    <h3>Add a piece</h3>
    <div class="form-row">
      <input id="item" type="text" placeholder="Item (e.g. Submariner case)">
      <input id="bought" type="number" placeholder="Price bought £">
      <input id="proj" type="number" placeholder="Projection £ (auto)">
      <button class="primary" id="addBtn">Add</button>
    </div>
    <p class="err" id="err"></p>
  </div>

  <div class="card">
    <h3>In stock</h3>
    <table>
      <thead>
        <tr>
          <th>Item</th>
          <th class="num">Bought</th>
          <th class="num">Proj.</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="empty" id="emptyInv" style="display:none;">No items in stock.</p>
  </div>

  <div class="card" id="soldCard" style="display:none;">
    <h3>Sold</h3>
    <table>
      <thead>
        <tr>
          <th>Item</th>
          <th class="num">Price</th>
          <th class="num">Profit</th>
        </tr>
      </thead>
      <tbody id="soldRows"></tbody>
    </table>
  </div>

  <div class="metric-lead">
    <p class="label">Total portfolio</p>
    <p class="value" id="totAll">£0</p>
  </div>
  <div class="grid">
    <div class="metric">
      <p class="label">Asset value (stock)</p>
      <p class="value" id="totBought">£0</p>
    </div>
    <div class="metric">
      <p class="label">Portfolio value (stock)</p>
      <p class="value" id="totProj">£0</p>
    </div>
    <div class="metric cash">
      <p class="label">Cash liquid</p>
      <p class="value" id="totCash">£0</p>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalWrap">
  <div class="modal">
    <p class="title">Sold <span id="modalItem"></span></p>
    <p class="sub">Enter the sale price</p>
    <input id="salePrice" type="number" placeholder="Sale price £" style="margin-bottom:8px;">

    <label class="check-row">
      <input type="checkbox" id="hadBox">
      <span>Had a box</span>
    </label>
    <input id="boxCost" type="number" placeholder="Box cost £" style="margin:8px 0;display:none;">

    <input id="extraCost" type="number" placeholder="Additional costs £ (shipping, parts...)" style="margin-bottom:8px;">

    <p class="sub" id="netPreview" style="display:none;"></p>
    <p class="err" id="modalErr"></p>
    <div class="buttons">
      <button class="primary" id="confirmSale">Confirm</button>
      <button id="cancelSale">Cancel</button>
    </div>
  </div>
</div>

<script>
const KEY = 'watch_inventory_items';
const SKEY = 'watch_inventory_sold';
let items = [];
let sold = [];
try { items = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) {}
try { sold = JSON.parse(localStorage.getItem(SKEY) || '[]'); } catch(e) {}
let pendingIndex = null;

function fmt(n){ return '£' + Math.round(n).toLocaleString(); }
function saveItems(){ try { localStorage.setItem(KEY, JSON.stringify(items)); } catch(e) {} }
function saveSold(){ try { localStorage.setItem(SKEY, JSON.stringify(sold)); } catch(e) {} }

function render(){
  const rows = document.getElementById('rows');
  rows.innerHTML = '';
  let tb=0, tp=0;
  items.forEach((it, i)=>{
    tb += it.bought; tp += it.proj;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${it.item}</td>
      <td class="num">${fmt(it.bought)}</td>
      <td class="num">${fmt(it.proj)}</td>
      <td class="actions">
        <button class="link-btn sold-link" data-i="${i}">Sold</button>
        <button class="link-btn del-link" data-i="${i}" aria-label="Remove">✕</button>
      </td>`;
    rows.appendChild(tr);
  });
  document.getElementById('emptyInv').style.display = items.length ? 'none' : 'block';

  const soldRows = document.getElementById('soldRows');
  soldRows.innerHTML = '';
  let cash=0;
  sold.forEach(s=>{
    const extra = (s.boxCost||0) + (s.extraCost||0);
    cash += s.sold - extra;
    const profit = s.sold - s.bought - extra;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${s.item}</td>
      <td class="num">${fmt(s.sold)}</td>
      <td class="num" style="color:${profit>=0?'var(--success-text)':'var(--danger)'};">${fmt(profit)}</td>`;
    soldRows.appendChild(tr);
  });
  document.getElementById('soldCard').style.display = sold.length ? 'block' : 'none';

  document.getElementById('totBought').textContent = fmt(tb);
  document.getElementById('totProj').textContent = fmt(tp);
  document.getElementById('totCash').textContent = fmt(cash);
  document.getElementById('totAll').textContent = fmt(tp + cash);

  rows.querySelectorAll('.del-link').forEach(b=>{
    b.addEventListener('click', ()=>{ items.splice(parseInt(b.dataset.i),1); saveItems(); render(); });
  });
  rows.querySelectorAll('.sold-link').forEach(b=>{
    b.addEventListener('click', ()=>{ openModal(parseInt(b.dataset.i)); });
  });
}

function openModal(i){
  pendingIndex = i;
  document.getElementById('modalItem').textContent = items[i].item;
  document.getElementById('salePrice').value = items[i].proj;
  document.getElementById('hadBox').checked = false;
  document.getElementById('boxCost').style.display = 'none';
  document.getElementById('boxCost').value = '';
  document.getElementById('extraCost').value = '';
  document.getElementById('modalErr').style.display = 'none';
  document.getElementById('netPreview').style.display = 'none';
  document.getElementById('modalWrap').style.display = 'flex';
}
function closeModal(){
  document.getElementById('modalWrap').style.display = 'none';
  pendingIndex = null;
}
document.getElementById('hadBox').addEventListener('change', (e)=>{
  document.getElementById('boxCost').style.display = e.target.checked ? 'block' : 'none';
  if(!e.target.checked) document.getElementById('boxCost').value = '';
});
document.getElementById('cancelSale').addEventListener('click', closeModal);
document.getElementById('confirmSale').addEventListener('click', ()=>{
  const err = document.getElementById('modalErr');
  const val = parseFloat(document.getElementById('salePrice').value);
  if(isNaN(val) || val<=0){
    err.textContent = 'Enter a valid sale price.';
    err.style.display = 'block';
    return;
  }
  const boxCost = document.getElementById('hadBox').checked
    ? (parseFloat(document.getElementById('boxCost').value) || 0)
    : 0;
  const extraCost = parseFloat(document.getElementById('extraCost').value) || 0;
  const it = items[pendingIndex];
  sold.unshift({item: it.item, bought: it.bought, sold: val, boxCost, extraCost});
  items.splice(pendingIndex,1);
  saveItems(); saveSold();
  closeModal();
  render();
});

document.getElementById('bought').addEventListener('input', (e)=>{
  const v = parseFloat(e.target.value);
  const projInput = document.getElementById('proj');
  if(!isNaN(v) && !projInput.dataset.manual){
    projInput.value = Math.round(v*1.5);
  }
});
document.getElementById('proj').addEventListener('input', (e)=>{ e.target.dataset.manual = '1'; });

document.getElementById('addBtn').addEventListener('click', ()=>{
  const err = document.getElementById('err');
  err.style.display='none';
  const item = document.getElementById('item').value.trim();
  const bought = parseFloat(document.getElementById('bought').value);
  let proj = parseFloat(document.getElementById('proj').value);
  if(!item || isNaN(bought) || bought<=0){
    err.textContent = 'Enter an item name and a valid price bought.';
    err.style.display='block';
    return;
  }
  if(isNaN(proj) || proj<=0) proj = Math.round(bought*1.5);
  if(proj < bought*1.5){
    err.textContent = 'Projection is below the 50% minimum markup (' + fmt(bought*1.5) + ').';
    err.style.display='block';
    return;
  }
  items.push({item, bought, proj});
  saveItems(); render();
  document.getElementById('item').value='';
  document.getElementById('bought').value='';
  document.getElementById('proj').value='';
  document.getElementById('proj').dataset.manual='';
  document.getElementById('item').focus();
});

render();
</script>
</body>
</html>
